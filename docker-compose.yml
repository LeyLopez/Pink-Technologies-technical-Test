version: "3.9"

services:
  api:
    build: .
    container_name: external-data-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      EXTERNAL_API_BASE_URL: https://www.alphavantage.co
      EXTERNAL_API_PATH: /query?function=CURRENCY_EXCHANGE_RATE&from_currency=USD&to_currency=COP
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: external_data_db
      DB_SSL: "false"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: external-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: external_data_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: